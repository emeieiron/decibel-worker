name = "decibel-worker"
main = "src/index.ts"
compatibility_date = "2026-08-31"
compatibility_flags = ["nodejs_compat"]
# The app reaches the Worker at its workers.dev address. Branch builds get no public preview URL,
# since previews run with production secrets.
workers_dev = true
preview_urls = false
# The app's address. Flare trades Decibel on Aptos mainnet and nothing else.
routes = [{ pattern = "api.mcxross.xyz", custom_domain = true }]

[vars]
NETWORK = "mainnet"
# Set PANORA_API_KEY to Panora's documented public key or a dedicated key.
# Quotes and self-paid execution do not require Gas Station sponsorship.
SWAPS_ENABLED = "true"
APP_ORIGIN = "flare://mobile"
DECIBEL_ORIGIN = "flare://mobile"
DECIBEL_REST_ORIGIN = "https://api.mainnet.aptoslabs.com/decibel"
DECIBEL_WS_ORIGIN = "wss://api.mainnet.aptoslabs.com/decibel/ws"
APTOS_FULLNODE_ORIGIN = "https://api.mainnet.aptoslabs.com/v1"
GAS_STATION_ORIGIN = "https://api.mainnet.aptoslabs.com/gs/v1"
DECIBEL_PACKAGE_ADDRESS = "0x50ead22afd6ffd9769e3b3d6e0e64a2a350d68e8b102c4e72e33d0b8cfdfdb06"
# Circle's native USDC on Aptos: an external asset, not a token this package mints.
USDC_METADATA_ADDRESS = "0xbae207659db88bea0cbead6da0ed00aac12edcdda169e591cd41c94180b46f3b"

[[durable_objects.bindings]]
name = "NONCES"
class_name = "FlareState"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "FlareState"

[[durable_objects.bindings]]
name = "SPONSORSHIPS"
class_name = "FlareState"

[exports.FlareState]
type = "durable-object"
storage = "sqlite"

# Anonymous browsing is four parallel REST calls per market refresh, so this is per-session
# traffic, not an abuse cap; IP_BACKSTOP_RATE_LIMITER is the abuse cap.
[[ratelimits]]
name = "ANONYMOUS_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60

# Handing out a session is not the same as using one, so it gets its own budget.
[[ratelimits]]
name = "SESSION_CREATION_RATE_LIMITER"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 10
  period = 60

# Debounced amount edits and quote renewal have a separate per-wallet budget.
[[ratelimits]]
name = "SWAP_QUOTE_RATE_LIMITER"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "AUTHENTICATED_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "IP_BACKSTOP_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 2_000
  period = 60

# Set DECIBEL_NODE_API_KEY, GAS_STATION_API_KEY, SESSION_SIGNING_KEY, and PANORA_API_KEY with
# `wrangler secret put`. Never place their values in this file.
