name = "decibel-worker"
main = "src/index.ts"
compatibility_date = "2026-08-31"
compatibility_flags = ["nodejs_compat"]
# The app reaches the Worker at its workers.dev address. Branch builds get no public preview URL,
# since previews run with production secrets.
workers_dev = true
preview_urls = false
# The app's address for this testnet Worker. api.mcxross.xyz is kept for the mainnet Worker.
routes = [{ pattern = "testnet.api.mcxross.xyz", custom_domain = true }]

[vars]
NETWORK = "testnet"
APP_ORIGIN = "flare://mobile"
DECIBEL_ORIGIN = "flare://mobile"
DECIBEL_REST_ORIGIN = "https://api.testnet.aptoslabs.com/decibel"
DECIBEL_WS_ORIGIN = "wss://api.testnet.aptoslabs.com/decibel/ws"
APTOS_FULLNODE_ORIGIN = "https://api.testnet.aptoslabs.com/v1"
GAS_STATION_ORIGIN = "https://api.testnet.aptoslabs.com/gs/v1"
DECIBEL_PACKAGE_ADDRESS = "0xe7da2794b1d8af76532ed95f38bfdf1136abfd8ea3a240189971988a83101b7f"
USDC_METADATA_ADDRESS = "0x5428acf5c112826d0c74ae1cd2de9030f53d1d01235e6c2621d967bf914ee1c8"

[[durable_objects.bindings]]
name = "NONCES"
class_name = "FlareState"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "FlareState"

[[durable_objects.bindings]]
name = "SPONSORSHIPS"
class_name = "FlareState"

[exports.FlareState]
type = "durable-object"
storage = "sqlite"

[[ratelimits]]
name = "ANONYMOUS_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "AUTHENTICATED_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "IP_BACKSTOP_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 2_000
  period = 60

# Set DECIBEL_NODE_API_KEY, GAS_STATION_API_KEY, and SESSION_SIGNING_KEY with
# `wrangler secret put`. Never place their values in this file.
